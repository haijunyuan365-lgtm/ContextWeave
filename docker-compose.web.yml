# 在现有 Python 数据环境上启动 Web 前端和 Java 后端。
# docker compose -f docker-compose.yml -f docker-compose.web.yml up -d --build
services:
  frontend:
    build:
      context: ../EchoMindFrontend
      dockerfile: Dockerfile
    container_name: echomind-web
    environment:
      PYTHON_API_URL: /api/python
      JAVA_API_URL: /api/java
    ports:
      - "127.0.0.1:5174:80"
    volumes:
      - ./config/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      echomind:
        condition: service_healthy
      echomind-java:
        condition: service_started
    restart: unless-stopped
    networks:
      - echomind-network

  echomind-java:
    build:
      context: ../EchoMindJava
      dockerfile: Dockerfile
    container_name: echomind-java
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: deepseek
      DEEPSEEK_API_KEY: ${ANTHROPIC_API_KEY:?需要在后端 .env 中配置模型 Key}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: ${ANTHROPIC_MODEL:-deepseek-v4-pro}
      LLM_FALLBACK_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-echomind123}
      CHROMA_HOST: http://chromadb
      CHROMA_PORT: "8000"
      ECHOMIND_DATA_DIR: /app/data/java
      KNOWLEDGE_STORE_PATH: /app/data/java/knowledge-store.json
      MEMORY_STORE_PATH: /app/data/java/memory-store.json
      ECHOMIND_SKILLS_DIR: /app/skills
    volumes:
      - echomind-java-data:/app/data
      - ../EchoMindJava/skills:/app/skills:ro
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - echomind-network

  nginx:
    volumes:
      - ./config/nginx/web-gateway.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started

volumes:
  echomind-java-data:
    external: true
    name: ${ECHOMIND_JAVA_DATA_VOLUME:-echomindjava_app-data}
