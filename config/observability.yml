# 本地历史需显式启用；访问接口还需 API admin 身份或 TRACE_ADMIN_TOKEN。
history:
  enabled: false
  path: data/observability/traces.sqlite3
  retention_days: 7
  max_traces: 2000
  max_spans_per_trace: 500
# 在全量 Metrics 投影之后，按 Trace ID 对历史和 OTLP 一致采样。
export_ratio: 1.0
# 费用只做估算。请填入服务商实际模型名和经过确认的价格，单位为每百万 Token。
# Anthropic usage 的 input 不含 cache_read / cache_write，四项分别计费。
# 未配置模型或任一 usage 缺失，不产生费用样本。
prices: {}
# 示例结构（数值须自行填写；这里不预设任何模型报价）：
# prices:
#   actual-response-model:
#     version: contract-2026-10
#     currency: USD
#     input: <number>
#     output: <number>
#     cache_read: <number>
#     cache_write: <number>
