# 在项目根目录执行，使用固定的独立项目名 echomind-tutorial。
# 本文件单独使用，不与根目录 Compose 叠加。
services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - tutorial-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - tutorial-chroma:/chroma/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  echomind:
    build:
      context: ../../..
      dockerfile: Dockerfile
      target: production
    env_file:
      - ../../../.env
    environment:
      ECHOMIND_ENV: development
      ECHOMIND_API_TOKENS: ""
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIRECTORY: /tmp/echomind-tutorial/chroma-fallback
      ECHOMIND_SEED_DEMO_DOCS: "false"
      EVAL_BASELINE_PATH: /tmp/echomind-tutorial/eval/baseline.json
      ECHOMIND_SKILLS_DIR: /app/skills
      MCP_EXTERNAL_ENABLED: "false"
      INTENT_EMBEDDING_PROVIDER: local
      PROMETHEUS_PORT: "0"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../../../skills:/app/skills:ro
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  tutorial-redis:
  tutorial-chroma:
